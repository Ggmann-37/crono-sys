<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant Blue to Deep Navy) -->
    <linearGradient id="cronoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Schedule Dock Glass Gradient -->
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85" />
    </linearGradient>

    <!-- Dock Top Rim Light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Wave Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.3" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="15" y="15" width="170" height="170" rx="52" fill="url(#cronoBgGrad)" filter="url(#subtleShadow)" />
  <rect x="15" y="15" width="170" height="170" rx="52" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Calendar / Schedule Dock -->
  <g filter="url(#subtleShadow)">
    <!-- Main Dock Box -->
    <rect x="48" y="58" width="104" height="66" rx="14" fill="url(#dockGrad)" />
    <!-- Dock Top Accent Bar -->
    <path d="M 48 70 C 48 63.37 53.37 58 60 58 L 140 58 C 146.63 58 152 63.37 152 70 L 152 73 L 48 73 Z" fill="url(#rimGrad)" opacity="0.9" />

    <!-- Schedule Dots / Time Slots (Row 1) -->
    <circle cx="70" cy="88" r="6" fill="#1d4ed8" />
    <circle cx="100" cy="88" r="6" fill="#0284c7" />
    <circle cx="130" cy="88" r="6" fill="#2563eb" />

    <!-- Schedule Dots / Time Slots (Row 2) -->
    <circle cx="70" cy="107" r="6" fill="#0284c7" />
    <circle cx="100" cy="107" r="6" fill="#1e40af" />
  </g>

  <!-- Dynamic Undulating Time Wave Under Dock -->
  <path d="M 52 144 C 70 137, 95 152, 120 142 C 135 136, 145 142, 150 143" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="3.8" 
        stroke-linecap="round" />
</svg>
