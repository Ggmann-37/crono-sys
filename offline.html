<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crono-SYS - Modo Sin Conexión</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root {
      --primary-600: #0284c7;
      --bg-main: #f8fafc;
      --text-main: #0f172a;
      --text-secondary: #475569;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }
    p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background-color: var(--primary-600);
      color: #ffffff;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
    }
    .btn:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="assets/logo.svg" alt="Crono-SYS" class="logo-img">
    <h1>Estás sin conexión</h1>
    <p>
      Parece que has perdido la conexión a internet. Crono-SYS continuará funcionando en modo local con los datos que tengas guardados en tu dispositivo en cuanto vuelvas a la aplicación.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Reintentar conexión
    </button>
  </div>
</body>
</html>
